  note: All statuses observed anonymously from a non-UK IP with a desktop browser
    User-Agent. www.rightmove.co.uk returns HTTP 200 with a branded "We couldn't find
    the place you were looking for." HTML page for unknown paths, so a 200 on that
    host is not evidence a resource exists; each was content-checked.

  - url: https://docs.rightmove.co.uk/
    status: 000
    note: NXDOMAIN.
  - url: https://api-docs.rightmove.co.uk/
    status: 200
    note: REAL developer portal. Angular SPA on Google Apigee integrated portal.
      Site id rightmove-pd-preprod-apigee-commercialpoc, site name "Rightmove APIs -
      Early adopters".
  - url: https://api-docs.rightmove.co.uk/portals/api/sites/rightmove-pd-preprod-apigee-commercialpoc/liveportal/sitemap
    status: 200
    note: Portal sitemap JSON. isLoggedIn false, features [portal.consumer_teams].
  - url: https://api-docs.rightmove.co.uk/portals/api/sites/rightmove-pd-preprod-apigee-commercialpoc/liveportal/apis
    status: 200
    note: API catalogue JSON, served anonymously. Exactly ONE API doc - id 502184,
      title "Commercial Listings", apiId/apiProductName property-feed-api-product,
      specId property-feed-product-api-2.1.6, specFormat YAML, anonAllowed true,
      snapshotState OK_SUBMITTED. apiProducts[0].description "PREPROD API Product
      giving agents access to manage properties via their feed providers/CRMs",
      approvalType auto. Single category "Beta users".
  - url: https://api-docs.rightmove.co.uk/portals/api/sites/rightmove-pd-preprod-apigee-commercialpoc/liveportal/apis/property-feed-api-product/download_spec
    status: 200
    note: HARVESTED. application/octet-stream, 75326 bytes, OpenAPI 3.0.1 YAML.
      Saved verbatim to openapi/rightmove-commercial-listings-openapi.yml.
  - url: https://api-docs.rightmove.co.uk/portals/api/sites/rightmove-pd-preprod-apigee-commercialpoc/liveportal/apis/property-feed-api-product/spec
    status: 200
    note: Same document, JSON-wrapped ("Returning spec snapshot"). Not saved
      separately - the download_spec YAML is the verbatim artifact.
  - url: https://api-docs.rightmove.co.uk/portals/api/sites/rightmove-pd-preprod-apigee-commercialpoc/apidocs
    status: 401
    note: '"No authorization header provided" - the admin catalogue is authenticated;
      the liveportal catalogue is not.'
  - url: https://api-docs.rightmove.co.uk/apis
    status: 429 / 503
    note: Rate limited and then served a Rightmove error page during probing. The
      SPA shell (2138 bytes) is what renders; content comes from the liveportal JSON
      endpoints above.
  - url: https://api-docs.rightmove.co.uk/docs/property-feed-api-product/1/overview
    status: 200
    note: SPA shell. Content confirmed via the portal page/API endpoints.
  - url: https://api-services.rightmove.co.uk/
    status: 404
    note: Live production API host, no root resource.
  - url: https://api-services.rightmove.co.uk/v2/property/commercial/branch
    status: 401
    note: 'CONFIRMS the documented production endpoint exists and is credential
      gated (application/json).'
  - url: https://api-services.rightmove.co.uk/oauth/token
    status: 405
    note: Method Not Allowed on GET - confirms the token endpoint exists.
  - url: https://api-services.adftest.rightmove.com/
    status: 404
    note: Staging host resolves and answers.
  - url: https://adfapi.rightmove.co.uk/
    status: 403
    note: Mutual-TLS gated. The RTDF specification names this host as the source of
      the JSON Schemas; they are NOT anonymously reachable.
  - url: https://adfapi.rightmove.co.uk/v1/property/sendpropertydetails
    status: 403
  - url: https://adfapi.rightmove.co.uk/v1/property/getbranchpropertylist
    status: 403
  - url: https://adfapi.rightmove.co.uk/swagger.json
    status: 403
  - url: https://adfapi.rightmove.co.uk/openapi.json
    status: 403
  - url: https://adfapi.rightmove.com/
    status: 000
    note: NXDOMAIN. The .com host cited in some third-party write-ups does not exist;
      the live host is adfapi.rightmove.co.uk.
  - url: https://api.rightmove.co.uk/
    status: 404
    note: Resolves and returns application/problem+json - an internal service host
      with no public documentation, catalogue or discovery document.
  - url: https://media.rightmove.co.uk/ps/pdf/guides/adf/Rightmove_Real_Time_Datafeed_Specification.pdf
    status: 200
    note: '935,801 bytes. "Rightmove Real Time Data Feed API Web Services
      Specification v1.4.1", last updated November 2023. Human-readable PDF, not a
      machine-readable contract, so not saved to openapi/.'
  - url: https://media.rightmove.co.uk/ps/pdf/guides/adf/RTDF_EULA.pdf
    status: 200
    note: 246,902 bytes. The binding End User Licence Agreement.
  - url: https://media.rightmove.co.uk/ps/pdf/guides/ADF_V4n_specification.pdf
    status: 200
    note: 724,397 bytes. "Rightmove Automated Data Feed Version 4.0n - New Homes",
      last updated December 2023. Bulk XML file feed with XSD RightmoveV4n.xsd; the
      XSD itself is not published at any probed media path (404).
  - url: https://media.rightmove.co.uk/ps/pdf/guides/adf/Provider_Contact_Form.pdf
    status: 200
  - url: https://github.com/rightmove
    status: 200
    note: 15 public repos; no API client or spec for these APIs.
  - url: https://plc.rightmove.co.uk/
    status: 200
    note: Rightmove plc investor relations site.
  - url: https://www.rightmove.co.uk/news/house-price-index/
    status: 200
    note: House Price Index as editorial/PDF, not as an API or open dataset.
  - url: https://status.rightmove.co.uk/
    status: 000
    note: NXDOMAIN. No public status page.
  - url: https://certification.reso.org/
    status: 400
    note: RESO certification directory refused an anonymous non-browser client, so
      the directory could not be read here. No Rightmove RESO claim was found in any
      Rightmove-owned property or document.

artifacts:
  openapi:
  - path: openapi/rightmove-commercial-listings-openapi.yml
    source_url: https://api-docs.rightmove.co.uk/portals/api/sites/rightmove-pd-preprod-apigee-commercialpoc/liveportal/apis/property-feed-api-product/download_spec
    fetched: '2026-07-26'
    http_status: 200
    content_type: application/octet-stream
    bytes: 75326
    format: OpenAPI 3.0.1 (YAML)
    parses: true
    validated_with: python3 yaml.safe_load
    info_title: Commercial Listings API
    info_version: 1.0.0
    servers:
    - https://api-services.adftest.rightmove.com (Staging)
    - https://api-services.rightmove.co.uk (Production)
    tags:
    - Property
    paths:
    - GET /v2/property/commercial/{reference}
    - PUT /v2/property/commercial/{reference}
    - DELETE /v2/property/commercial/{reference}
    - GET /v2/property/commercial/branch
    component_schemas: 50
    security_schemes:
    - OAuth2
    webhooks: none
    verbatim: true
    note: Saved exactly as served. No fields added, removed or corrected.
  odata_metadata: []
  note: No OData $metadata document exists for Rightmove - it publishes no OData or
    RESO Web API surface. No JSON Schema artifacts were harvestable; the RTDF JSON
    Schemas live behind mutual TLS on adfapi.rightmove.co.uk and the New Homes XSD
    (RightmoveV4n.xsd) is distributed with the specification pack rather than served
    at a public URL.

sources:
- url: https://www.rightmove.co.uk/adf.html
  type: Documentation
  note: Public ADF specifications page. Source for the onboarding and testing
    process, the four documented feeds, and the adfsupport@rightmove.co.uk contact.
- url: https://api-docs.rightmove.co.uk/
  type: DeveloperPortal
  note: Apigee integrated developer portal, "Rightmove APIs - Early adopters".
- url: https://api-docs.rightmove.co.uk/docs/property-feed-api-product/1/overview
  type: Documentation
  note: Commercial Listings API overview - scope, environments, credentials, media,
    visibility rules, error handling.
- url: https://api-docs.rightmove.co.uk/authentication
  type: Authentication
  note: OAuth2 client_credentials, ClientId/ClientKey issued by Rightmove, Bearer
    token, scopes not implemented.
- url: https://media.rightmove.co.uk/ps/pdf/guides/adf/Rightmove_Real_Time_Datafeed_Specification.pdf
  type: Specification
  note: RTDF v1.4.1 - thirteen endpoints, mutual-TLS auth, Network_ID/Branch_ID/Agent_Ref.
- url: https://media.rightmove.co.uk/ps/pdf/guides/adf/RTDF_EULA.pdf
  type: License
  note: Names the four-API family and the licence grant; identifies Rightmove Group
    Limited, company number 03997679.
- url: https://media.rightmove.co.uk/ps/pdf/guides/ADF_V4n_specification.pdf
  type: Specification
  note: New Homes bulk XML feed v4.0n.

actions:
  apisYmlCreated: true
  apisListed: 2
  specsHarvested: 1
  readmeCreated: true
  reason: |
    Two real, documented HTTP APIs were captured with one verbatim machine-readable
    contract. The New Homes ADF v4.0n is a bulk XML file feed rather than an HTTP
    API, so it is recorded in common[] as a Specification instead of being listed as
    an API. Nothing was inferred, and no endpoint, host, scope or spec was invented.

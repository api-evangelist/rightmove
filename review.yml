aid: rightmove
name: Rightmove
review:
  question: Does Rightmove expose a real, reachable public developer API surface, and
    what is its RESO posture?
  answer: partial
  date: '2026-07-26'
  reviewer: API Evangelist
  summary: |
    Rightmove publishes real machine-readable contracts and a real developer portal,
    but no anonymously callable API. A public Apigee-hosted portal at
    api-docs.rightmove.co.uk ("Rightmove APIs - Early adopters") serves one OpenAPI
    3.0.1 document anonymously — the Commercial Listings API — which was harvested
    verbatim and parses. A second API, the Real Time Data Feed (RTDF), is documented
    in a publicly downloadable PDF specification (v1.4.1) but is mutual-TLS gated and
    returns 403 to anonymous callers. Both are WRITE-side APIs for pushing agent
    listings INTO Rightmove; there is no public read API for listings, sold prices
    or valuations. Working credentials for every environment are issued case by case
    by the Rightmove Data Feed Team, and use is governed by a binding End User Licence
    Agreement with Rightmove Group Limited.

sector_posture:
  home_market: United Kingdom
  tier: portal-marketplace
  market_seam: |
    The UK has no MLS. Residential listings are controlled by two portals — Rightmove
    and Zoopla — and reach them through agency CRM software and feed providers rather
    than through a shared cooperative database. Rightmove therefore has no obligation
    to expose a standard read contract, and it does not. What it does expose is the
    inbound side: the schemas an agent's CRM must satisfy to get stock onto the site.
    The open-data counterweight in this market sits with the public sector (HM Land
    Registry Price Paid, Ordnance Survey addressing), not with Rightmove.

  reso_posture: |
    NO RESO REFERENCE FOUND ANYWHERE IN RIGHTMOVE'S SURFACE.

    - RESO Web API certification: none found. No `Reso` route, no OData service root,
      no `$metadata` document, and no OData conventions ($filter/$select/$expand,
      @odata.* annotations) anywhere in the harvested OpenAPI or in the RTDF
      specification.
    - RESO Data Dictionary certification (any version — 1.7, 2.0): none found.
      Rightmove uses its own proprietary schema. The Commercial Listings OpenAPI
      declares 50 component schemas of Rightmove's own design (Building, Space,
      Media, MediaAsset, ProblemDetail, PropertyReference, ...) with Rightmove's own
      enumerations (status values AVAILABLE, SOLD_STC, SOLD_STCM, RESERVED,
      LET_AGREED, UNDER_OFFER — these are British transaction states with no RESO
      Data Dictionary equivalent). The RTDF spec uses Rightmove field names
      (Network_ID, Branch_ID, Agent_Ref, Channel, Published, Property_Type,
      Student_Property, TV_Licence_Inc) that are likewise proprietary.
    - RESO certification directory: RESO's directory pages were probed and returned
      HTTP 400 to an anonymous non-browser client, so the directory itself could not
      be read here; however no Rightmove RESO claim surfaced in any Rightmove-owned
      property, any Rightmove document, or any web search.
    - Universal Property Identifier (UPI): not present. The API keys properties on
      an agent-supplied `reference` (Commercial Listings) or `Agent_Ref` (RTDF),
      scoped by Rightmove-issued Network_ID/Branch_ID.
    - Assessment: this is a true absence, not a gap in probing. RESO is a North
      American standard mandated by NAR for US MLSs. There is no NAR, no MLS and no
      RESO-equivalent industry mandate in the UK, so the honest answer for a UK
      portal is that RESO simply does not apply. The certification-is-not-reachability
      tension does not arise here — Rightmove is neither certified nor reachable.
    - reso_certified: false

  access_gate:
    classification: application-approval
    what_a_developer_must_do_or_sign: |
      1. Contact the Rightmove Data Feed Team at adfsupport@rightmove.co.uk. Every
         documented path to credentials routes through this mailbox. The Commercial
         Listings API overview states test credentials "requires test credentials
         issued by the Rightmove Data Feed Team" and production "requires separate
         production credentials, also provided by the Rightmove Data Feed Team". The
         ADF page states "For access to the schemas or to be set up on the testing
         environment, please contact the ADF Team at adfsupport@rightmove.co.uk".
      2. Accept the RTDF End User Licence Agreement — a binding legal agreement with
         RIGHTMOVE GROUP LIMITED (company number 03997679, 2 Caldecotte Lake Business
         Park, Milton Keynes MK7 8LE), granting "a non-transferable, non-exclusive,
         revocable, royalty-free licence". The EULA defines the Data Feed as covering
         "the Commercial API, the New Homes API, the Overseas API and the UK Sales and
         Lettings API".
      3. Submit the ADF Provider Contact Form (PDF).
      4. Complete a supervised testing cycle. For the Real Time Data Feed the
         documented process is: request a testing commencement date; supply a mobile
         number and preferred keystore format; receive a test pack and keystore with
         cryptographic authentication details by email and the password by SMS 1-2
         working days beforehand; test against Rightmove's test environment; then
         request live details, which arrive as a live keystore, passwords and network
         details by email and SMS.
      5. In practice, hold or act for a Rightmove membership. RTDF calls require a
         Network_ID and Branch_ID, which are "unique Rightmove reference" values
         issued to member agents and their branches, and the EULA distinguishes
         "Member" (a Rightmove customer per the Membership Classification) from a
         non-Member acting as "Our Member's data processor". A developer with no
         agent relationship has nothing to send.
    nuance: |
      The portal's Get Started page is stock Apigee boilerplate (Sign in → Register
      apps → Access the API keys) and the Property Feed API Product carries
      approvalType "auto", so the portal LOOKS self-serve. It is not: the API's own
      overview and authentication pages both state that credentials for BOTH the
      api-test and production environments are issued by the Rightmove Data Feed Team.
      Classified application-approval rather than self-serve for that reason, and
      rather than membership-required because Rightmove is a commercial portal, not
      an MLS, board or association.
    portal_maturity_caveat: |
      The developer portal is explicitly pre-production. Its site id is
      `rightmove-pd-preprod-apigee-commercialpoc`, its Apigee org is
      `rightmove-pd-preprod-apigee`, its only API category is "Beta users", the site
      title is "Rightmove APIs - Early adopters", and the API product description
      reads "PREPROD API Product giving agents access to manage properties via their
      feed providers/CRMs". The production API host it documents
      (https://api-services.rightmove.co.uk) is nonetheless live and answers 401 on
      the documented endpoint.

  open_data:
    exists: false
    detail: |
      Rightmove publishes no open, unlicensed, publicly callable dataset. The
      Rightmove House Price Index is released as editorial/press pages and PDF
      reports at https://www.rightmove.co.uk/news/house-price-index/ (HTTP 200), not
      as an API, and all feed data is governed by the RTDF EULA. Rightmove's
      robots.txt explicitly disallows /api/*. Genuinely open UK property data exists
      but belongs to the public sector — HM Land Registry Price Paid Data and
      Ordnance Survey open products — not to Rightmove; those are separate
      organisations and are out of scope for this profile.

  auth_model:
    commercial_listings_api: |
      OAuth2 client credentials, server to server. Token endpoint /oauth/token on
      each environment (https://api-services.adftest.rightmove.com/oauth/token for
      test). Client presents a ClientId and ClientKey issued by Rightmove, base64
      encoded, and uses the returned token as `Authorization: Bearer <ACCESS_TOKEN>`.
      Scopes "are not currently required or implemented". Note a defect in the
      published contract: components.securitySchemes.OAuth2 declares a type of
      `oauth2` but describes flows.implicit with authorizationUrl `/oauth/token` and
      an empty scopes object, while the prose and the authentication page both say
      client_credentials. Recorded verbatim in the harvested spec; not corrected.
      There is no top-level `security` requirement in the document.
    real_time_data_feed_api: |
      Mutual TLS with a client certificate. Rightmove supplies a keystore containing
      a private key and an X.509 certificate, in the keystore format the provider
      requests, by email, with the password delivered by SMS. TLS 1.2 required
      (support for TLS 1.0 and 1.1 was removed). Certificate providers must be on
      Rightmove's supported list, obtained from the Data Feed Team. Calls additionally
      carry Rightmove-issued Network_ID and Branch_ID values.
    openid_connect: |
      No OpenID Connect discovery document. https://www.rightmove.co.uk/.well-known/openid-configuration
      returns Rightmove's branded soft-404 HTML page, not JSON.

  webhooks_events_sdks_postman:
    webhooks: none. The harvested OpenAPI declares no `webhooks` object and no
      callbacks. The RTDF is poll-based - reconciliation is done by the consumer
      calling GetBranchPropertyList and comparing Agent_Ref/Update_Date.
    events: none published. The Commercial Listings API is documented as
      asynchronous ("changes may take some time to reflect on the live website") but
      exposes no event stream, no AsyncAPI and no callback URL (requireCallbackUrl
      is false on the portal API doc record).
    sdks: none published by Rightmove. github.com/rightmove exists (15 public repos)
      but publishes no API client for these APIs. Third-party libraries exist (for
      example the community PHP library frozensheep/rightmoveADF) but are not
      Rightmove artifacts.
    postman: no Postman collection or workspace published.
    graphql: none. The portal record has graphqlSchema null and graphqlEndpointUrl
      null.
    grpc_asyncapi: none. grpcZipContent and asyncApiSpecContent are both null on the
      portal record.
    status_page: none found - status.rightmove.co.uk does not resolve.
    security_txt: none - /.well-known/security.txt returns the branded soft-404 HTML.

  product_api_family: |
    The RTDF EULA names Rightmove's API family verbatim as "the Commercial API, the
    New Homes API, the Overseas API and the UK Sales and Lettings API". Mapped to
    what is actually documented:
      - UK Sales and Lettings  -> Real Time Data Feed, SendProperty/RemoveProperty/
        GetBranchPropertyList on adfapi.rightmove.co.uk/v1/property/
      - Overseas               -> same RTDF interface, OverseasSendPropertyDetails
      - Commercial             -> Commercial Listings API (OpenAPI 3.0.1) on
        api-services.rightmove.co.uk/v2/property/commercial/
      - New Homes              -> Automated Data Feed v4.0n, a bulk XML file feed
        (XSD RightmoveV4n.xsd, file transfer, daily full upload). NOT an HTTP API, so
        it is recorded in common[] as a Specification rather than in apis[].
    Segmentation the docs themselves use: listings upload/update/remove, plus branch
    and property performance reporting and lead/enquiry email retrieval on the RTDF.
    There is no valuation/AVM API, no title or Land Registry API, no transaction,
    conveyancing, tenancy, document or payments API in Rightmove's published surface.

probes:

lifecycle_rules:
- A new `reference` creates a listing; the same `reference` updates it.
- A BUILDING may be converted to SPACE keeping the building reference; the reverse requires delete and re-upload.
- Unpublishing a building cascades published=false to all of its spaces; republishing the building does NOT republish the spaces, which must each be set published=true.
- DELETE is permanent and removes associated listings.

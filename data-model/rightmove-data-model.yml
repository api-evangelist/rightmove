summary: >-
  The Commercial Listings API models one aggregate: a commercial PROPERTY, which
  is either a standalone BUILDING or a BUILDING that contains up to 50 SPACES.
  Everything else in the 50-schema component set hangs off those two entities as
  a value object (pricing, sizing, location, media, classification) or an
  enumeration. There is no customer, order, transaction or user entity — the API
  is a listings-publishing surface, not a marketplace API. The Real Time Data
  Feed models the same shape for residential/overseas stock but its JSON Schemas
  are behind mutual TLS and could not be harvested.
identity:
  primary_key: reference
  key_type: agent-supplied string, unique within the agent/branch scope
  key_note: >-
    The building reference is supplied in the request path; each space carries its
    own reference which must be unique and different from the building's. There
    is no Rightmove-issued surrogate id in the Commercial payload (the RTDF
    returns a Rightmove_ID and Rightmove_URL on write).
  external_identifiers:
  - {field: location.uprn, standard: Unique Property Reference Number (Ordnance Survey / GeoPlace), type: int64}
  - {field: building.agentId, description: Rightmove branch/agent identifier the listing belongs to}

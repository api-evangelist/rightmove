name: Rightmove
kind: company
description: Rightmove is the United Kingdom's largest residential property portal,
  operated by Rightmove Group Limited (Milton Keynes) and listed on the London Stock
  Exchange as Rightmove plc. It aggregates for-sale, to-let, new-homes, commercial
  and overseas listings supplied by member estate agents, letting agents and new-homes
  developers, and monetises the audience by charging those agents for advertising rather
  than by licensing data. The UK has no MLS, so Rightmove sits at the demand end of
  the value chain and its inbound feeds — not any cooperative database — are the machine-readable
  surface. Its API posture is publish-in, not read-out - the documented APIs let an agent's
  CRM or feed provider push listings into Rightmove, and there is no public API for
  reading listings, sold prices or valuations. A public Apigee developer portal at
  api-docs.rightmove.co.uk ("Rightmove APIs - Early adopters") anonymously serves a
  real OpenAPI 3.0.1 contract for the Commercial Listings API, and www.rightmove.co.uk/adf.html
  publishes the Real Time Data Feed specification, but working credentials for every
  environment are issued case by case by the Rightmove Data Feed Team and use is governed
  by a binding End User Licence Agreement. No RESO Web API or Data Dictionary certification,
  OData `$metadata` document or Universal Property Identifier appears anywhere in
  Rightmove's surface - RESO is a North American, NAR-driven standard with no UK
  counterpart, and Rightmove uses its own proprietary ADF/RTDF schema instead.

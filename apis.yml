apis:
- aid: rightmove:rightmove-commercial-listings-api
  name: Rightmove Commercial Listings API
  description: >-
    The Commercial Listings API allows commercial agents and feed providers to upload,
    update, retrieve and remove commercial property listings for display on the Rightmove
    website. It models a property as either a BUILDING or a SPACE, carries media
    (photos, floor plans, EPCs, EPC graphs, brochures, virtual tours) as publicly
    reachable URLs, and processes changes asynchronously. Residential listings are
    explicitly out of scope and must continue to go through the Real Time Data Feed
    API. Authentication is OAuth2 client credentials with credentials issued by the
    Rightmove Data Feed Team; errors are returned as RFC 7807-style ProblemDetail
    bodies. The published OpenAPI declares two paths — GET/PUT/DELETE on
    /v2/property/commercial/{reference} and GET on /v2/property/commercial/branch —
    plus a staging server at https://api-services.adftest.rightmove.com.
  humanURL: https://api-docs.rightmove.co.uk/docs/property-feed-api-product/1/overview
  baseURL: https://api-services.rightmove.co.uk

- aid: rightmove:rightmove-real-time-data-feed-api
  name: Rightmove Real Time Data Feed API
  description: >-
    The Real Time Data Feed (RTDF) is Rightmove's incremental HTTPS/JSON interface for
    UK sales, lettings and overseas sales listings, used by estate agency CRM and feed
    provider software rather than by end developers. The publicly downloadable
    specification (v1.4.1, last updated November 2023) documents thirteen calls on
    https://adfapi.rightmove.co.uk/v1/property/, including SendPropertyDetails,
    OverseasSendPropertyDetails, RemoveProperty, GetBranchPropertyList,
    AddPremiumListing, AddFeaturedProperty, RemoveFeaturedProperty,
    GetBranchPerformance, GetPropertyPerformance, GetBrandEmails, GetBranchEmails,
    GetPropertyEmails and ErrorCodes. Calls carry a Rightmove-issued Network_ID and
    Branch_ID and an Agent_Ref that keys create-versus-update. Access is mutual-TLS -
    Rightmove issues an X.509 certificate and private key in a keystore by email with
    the password sent by SMS - so neither the endpoints nor the referenced JSON
    Schemas are reachable anonymously (probed 403).
  humanURL: https://www.rightmove.co.uk/adf.html
  baseURL: https://adfapi.rightmove.co.uk/v1

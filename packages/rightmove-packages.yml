summary: >-
  Rightmove publishes NO first-party client library for either the Commercial
  Listings API or the Real Time Data Feed. github.com/rightmove holds 15 public
  repositories, all of them hiring/interview exercises (remote-java-test,
  Code-Challenge-*, angular-fed-test) plus rightmove.github.io — no SDK, no
  proto, no spec. Every package below is COMMUNITY-maintained and unaffiliated
  with Rightmove Group Limited; several are HTML scrapers rather than clients of
  the documented, credential-gated APIs. No `official: true` package exists, so
  no SDKs pointer is wired for this provider.

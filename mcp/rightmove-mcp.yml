summary: >-
  Rightmove publishes NO official Model Context Protocol server. No mcp.* host,
  no @modelcontextprotocol package, no MCP entry in the Apigee portal catalogue
  and no mention of agents or MCP anywhere in the developer surface (searched
  2026-07-26). A third-party npm package `rightmove-mcp-server` exists but is
  unaffiliated with Rightmove and is built on scraping the consumer website, not
  on the documented APIs — Rightmove exposes no public read/search API for
  listings. The tool set below is DERIVED from the four Commercial Listings API
  operations as a proposal for an agent-facing surface; it is not published by
  Rightmove and no MCPServer pointer is wired for this provider.
